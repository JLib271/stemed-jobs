name: Tests

# Runs on every pull request and push to main (and when started by hand or by add-position), so a change that breaks the
# configuration or the sorting is caught before it is merged and published.
on:
  pull_request:
  push:
    branches: [main]
  # The add-position workflow starts this on its pull request's branch; pull requests opened by a
  # workflow don't start the tests on their own.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
