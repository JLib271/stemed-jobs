name: Add a submitted position

# An editor pastes a Seekers' Hub job-form email into the "Add a submitted position (editors)" issue
# template and adds the "approved" label. This saves the position as submitted/<id>.json on a branch,
# opens a pull request, runs the tests on it, and merges it when they pass (main is protected: changes
# reach it only through a pull request whose "test" check passed). Then it replies on the issue, closes
# it, and starts "Regenerate job feeds". If the tests fail, the pull request stays open for an editor.
# Only people with triage access or more can add labels, so only editors can trigger it.
#
# Needs "Allow GitHub Actions to create and approve pull requests" turned on in
# Settings > Actions > General > Workflow permissions.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: add-position
  cancel-in-progress: false

jobs:
  add:
    if: >-
      github.event.label.name == 'approved' &&
      (contains(github.event.issue.labels.*.name, 'position: add') ||
       contains(github.event.issue.body, 'The form email, pasted whole'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Read the email
        id: read
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python -m stemed_jobs.submitted --issue --result "$RUNNER_TEMP/reply.md"
      - name: Save the position as a pull request and merge it when the tests pass
        id: save
        if: steps.read.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          POSITION: ${{ steps.read.outputs.position }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          branch="submitted-position/issue-${ISSUE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add submitted
          git commit -m "Submitted position ${POSITION} (from #${ISSUE})"
          git push --force origin "$branch"
          if ! gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "Submitted position ${POSITION}" \
              --body "Approved in #${ISSUE}. Opened by the add-position workflow, which merges it when the tests pass."
          fi
          # Pull requests opened by this workflow don't start other workflows on their own, so start
          # the tests here; their "test" check counts for the pull request.
          sha=$(git rev-parse HEAD)
          gh workflow run tests.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml --commit "$sha" \
              --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -n "$run_id" ] && gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status >/dev/null; then
            gh pr merge "$branch" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reply on the issue
        if: always() && steps.read.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          CHANGED: ${{ steps.read.outputs.changed }}
          MERGED: ${{ steps.save.outputs.merged }}
        run: |
          if [ "$CHANGED" = "true" ] && [ "$MERGED" != "true" ]; then
            {
              echo "**Not published yet.** The position was saved in the pull request for branch"
              echo "\`submitted-position/issue-${ISSUE}\`, but it could not be merged (the tests failed or"
              echo "did not finish). An editor can check the pull request and merge it; the next daily run"
              echo "will then publish the position."
            } > "$RUNNER_TEMP/reply.md"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reply.md"
            exit 1
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reply.md"
          if [ "$CHANGED" = "true" ]; then
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
            gh workflow run regenerate-feeds.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label approved || true
          fi
