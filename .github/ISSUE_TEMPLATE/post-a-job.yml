# Generated by: python -m stemed_jobs.submitted --write-spec
name: Post a job
description: Post a position in STEM+ education research or teaching to STEMEd+ Jobs.
title: "Position: "
labels: ["position: add"]
body:
  - type: markdown
    attributes:
      value: >-
        Thank you for posting to STEMEd+ Jobs. An editor reviews each position before it appears.
        It stays listed until shortly after its application deadline, or for the academic hiring
        year if no deadline is given. Put the position title in the issue title too.
  - type: input
    id: title
    attributes:
      label: "Position title"
    validations:
      required: true
  - type: input
    id: institution
    attributes:
      label: "Institution or organization"
      description: "Its full name, not an abbreviation."
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: "Location"
      description: "City and state or country, or Remote."
    validations:
      required: true
  - type: dropdown
    id: audiences
    attributes:
      label: "Who is this position for?"
      description: "Choose all that apply."
      multiple: true
      options:
        - "Graduate Student"
        - "Postdoc"
        - "Faculty"
        - "Professional Staff"
    validations:
      required: true
  - type: dropdown
    id: disciplines
    attributes:
      label: "Disciplines"
      description: "Choose any. Leave blank if none fit; we will sort it by its text."
      multiple: true
      options:
        - "Agriculture"
        - "Bioscience"
        - "Chemistry"
        - "Earth Science"
        - "Engineering"
        - "Health Education"
        - "History & Philosophy of Science"
        - "Human Dimensions"
        - "Learning Science"
        - "Mathematics"
        - "Physics"
        - "Science & Health Communication"
        - "Science Education"
        - "STEAM: Arts+STEM"
    validations:
      required: false
  - type: input
    id: url
    attributes:
      label: "Link to the official posting"
      description: "Where applicants read the full ad and apply. Starts with https://"
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: "Application deadline"
      description: "For example January 15, 2027, or rolling."
    validations:
      required: false
  - type: input
    id: review
    attributes:
      label: "Review of applications begins"
      description: "Only if the ad says when review begins."
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "A short summary of the position, up to 2000 characters."
    validations:
      required: true
